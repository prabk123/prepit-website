name: CI

on:
  pull_request:
    branches: [main, website-revamp]
  push:
    branches: [main, website-revamp]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build
        env:
          # The shared meal plan page reads Mongo at request time only; the
          # build just needs the variables to exist.
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB_NAME: ci
          NEXT_TELEMETRY_DISABLED: 1
